<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FRACTURED — World Module Test</title>
<link rel="stylesheet" href="./world.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05040a}
#test-ui{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:20;display:flex;gap:8px;justify-content:center}
#test-ui button{border:1px solid #bda978;background:#111018dd;color:#f6edd8;border-radius:999px;padding:12px 18px;font:700 12px system-ui}
#ground-marker{position:fixed;left:0;right:0;height:1px;background:#e6c77b55;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="world-host"></div>
<div id="ground-marker"></div>
<div id="test-ui">
  <button id="left">CAMERA LEFT</button>
  <button id="center">CENTER</button>
  <button id="right">CAMERA RIGHT</button>
</div>
<script type="module">
import { FracturedWorld } from "./worldRenderer.js";

const world = new FracturedWorld({
  mount: document.getElementById("world-host"),
  imageSrc: "./assets/shattered_kingdom_world.jpeg",
  groundRatio: 0.755
});

world.start();

const marker = document.getElementById("ground-marker");
const syncGround = () => marker.style.top = world.getGroundY() + "px";
addEventListener("resize", syncGround);
syncGround();

document.getElementById("left").onclick = () => world.setCameraFromWorldX(0.26);
document.getElementById("center").onclick = () => world.setCameraFromWorldX(0.50);
document.getElementById("right").onclick = () => world.setCameraFromWorldX(0.74);

window.FRACTURED_WORLD = world;
</script>
</body>
</html>
