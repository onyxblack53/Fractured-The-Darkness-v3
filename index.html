<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>FRACTURED: The Darkness — Angel Knight</title>
  <link rel="stylesheet" href="./game.css" />
</head>
<body>
  <main id="game-shell">
    <canvas id="game" width="1170" height="720" aria-label="FRACTURED gameplay canvas"></canvas>

    <section id="hud" aria-label="Player HUD">
      <div class="bar"><span>HP</span><div class="track"><div id="hp-fill"></div></div></div>
      <div class="bar"><span>STA</span><div class="track"><div id="stamina-fill"></div></div></div>
      <div id="state-label">IDLE</div>
    </section>

    <section id="controls" aria-label="Mobile controls">
      <div id="move-pad" class="pad" aria-label="Movement pad">
        <div id="move-knob"></div>
      </div>

      <button id="jump-btn" class="round jump">JUMP</button>

      <div id="combat-cluster">
        <button id="ability1-btn" class="small ability a1">I</button>
        <button id="ability2-btn" class="small ability a2">II</button>
        <button id="ability3-btn" class="small ability a3">III</button>

        <button id="attack-btn" class="small attack">ATK</button>
        <button id="block-btn" class="small block">BLK</button>
        <button id="heal-btn" class="small heal">HEAL</button>
        <button id="dodge-btn" class="round dodge">DODGE</button>
      </div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
