<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angel Knight Animation Test</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0a0a12; color: #f1e6c9; font-family: Georgia, serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 12px; }
    canvas { width: 100%; max-width: 900px; aspect-ratio: 16/9; background: radial-gradient(circle at center, #1a1b34 0%, #090911 70%); border: 1px solid rgba(255,255,255,.12); display:block; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    button { background:#141524; color:#f1e6c9; border:1px solid #8f7a4a; padding:10px 14px; border-radius:10px; font-size:16px; cursor:pointer; }
    .row { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
    .notes { max-width: 900px; line-height: 1.5; opacity: .9; }
    code { background:#141524; padding:2px 5px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Angel Knight Animation Test</h1>
    <div class="row">
      <canvas id="game" width="1280" height="720"></canvas>
    </div>
    <div class="controls">
      <button data-action="idle">Idle</button>
      <button data-action="run">Run</button>
      <button data-action="jump">Jump</button>
      <button data-action="block">Block</button>
      <button data-action="dash">Dash</button>
      <button data-action="attack">Attack Combo</button>
      <button id="face-left">Face Left</button>
      <button id="face-right">Face Right</button>
    </div>
    <p class="notes">
      This preview uses the provided sprite sheets as code-driven animations. Use <code>angel_knight_animations.js</code> in your game and call <code>animator.trigger('attack')</code>, <code>animator.trigger('run')</code>, etc.
    </p>
  </div>
  <script type="module">
    import { AngelKnightAnimator } from './angel_knight_animations.js';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const animator = await new AngelKnightAnimator().load();

    let last = performance.now();
    function loop(now) {
      const dt = (now - last) / 1000;
      last = now;
      animator.update(dt);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ground
      ctx.fillStyle = '#1b1d2a';
      ctx.fillRect(0, 570, canvas.width, 150);
      ctx.fillStyle = '#27293a';
      for (let i = 0; i < canvas.width; i += 85) {
        for (let j = 570; j < 720; j += 38) {
          ctx.strokeStyle = '#3f4255';
          ctx.strokeRect(i, j, 82, 34);
        }
      }

      animator.draw(ctx, 360, 250, 370, 370);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    document.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => animator.trigger(btn.dataset.action));
    });
    document.getElementById('face-left').addEventListener('click', () => animator.setFacing('left'));
    document.getElementById('face-right').addEventListener('click', () => animator.setFacing('right'));
  </script>
</body>
</html>
