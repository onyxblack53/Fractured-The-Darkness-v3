<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070609"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>FRACTURED: The Darkness</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050407;color:#eee;font-family:Georgia,serif;touch-action:none;-webkit-user-select:none;user-select:none}
#app{width:100%;height:100svh;display:grid;grid-template-rows:minmax(0,1fr) clamp(190px,29svh,228px);background:#070609;overflow:hidden}
#stage{position:relative;overflow:hidden;border-bottom:2px solid #4b2630}canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000}
.portrait{display:flex;gap:8px;align-items:flex-start}.crest{width:56px;height:56px;border-radius:50%;border:2px solid #72515a;background:radial-gradient(#40303b,#100c12);display:grid;place-items:center;font-size:27px}
.stats{width:180px}.name{font-size:16px}.bar{height:10px;margin-top:4px;border:1px solid #73535e;background:#110d12;border-radius:8px;overflow:hidden}.hp{height:100%;width:100%;background:linear-gradient(90deg,#781f32,#d13d4f)}.mp{height:100%;width:100%;background:linear-gradient(90deg,#163e75,#2877c7)}.xp{height:100%;width:0%;background:#a17834}.coins{font-family:system-ui;font-size:13px}
#quest{position:absolute;top:92px;left:14px;font-size:13px;text-shadow:0 2px 4px #000}.qtitle{font-size:16px}.diamond{color:#e0a54d}
#controls{position:relative;min-width:0;width:100%;overflow:hidden;background:radial-gradient(circle at 50% 0,#1a1016,#070609 70%);border-top:1px solid #6b3943;padding:12px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:4px}
#controls:before{content:"";position:absolute;inset:5px;border:1px solid #38222a;pointer-events:none}.move,.combat{position:relative;z-index:2}.move{display:flex;align-items:flex-end;gap:10px;padding:42px 4px 4px}.combat{display:grid;grid-template-rows:74px 1fr}.abilities{display:flex;justify-content:space-around;align-items:start}.actions{display:flex;justify-content:space-around;align-items:end}
.btn{border-radius:50%;border:2px solid #765866;background:radial-gradient(circle at 45% 35%,#29222a,#0c0a0e 72%);color:#eee;box-shadow:inset 0 0 0 3px #100c11,0 4px 10px #0008;font-family:Georgia;font-weight:bold}
.big{width:clamp(46px,15vw,64px);height:clamp(46px,15vw,64px);font-size:24px}.ability{width:clamp(40px,12vw,54px);height:clamp(40px,12vw,54px)}.act{width:clamp(42px,13vw,57px);height:clamp(42px,13vw,57px)}.btn:active{transform:scale(.91);filter:brightness(1.35)}
.caption{text-align:center;font-size:10px;opacity:.75;margin-top:3px}
#splash,#select,#loading{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#24131b,#050407 72%);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#select,#loading{display:none}.panel{width:min(430px,94vw)}.logo{font-size:39px;letter-spacing:5px;text-shadow:0 0 18px #7c1e2d}.subtitle{letter-spacing:6px;color:#aaa;font-size:13px}.sigil{font-size:86px;color:#7e2635;margin:28px 0}.gbtn{width:100%;padding:14px;border:1px solid #9c3b4b;background:linear-gradient(#541725,#260d14);color:white;font:700 16px Georgia;letter-spacing:2px}.selectgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:48vh;overflow:auto;margin:14px 0}.card{padding:12px 7px;background:#100c11;border:1px solid #4a343b;color:#ddd}.card.sel{border-color:#cf4659;box-shadow:inset 0 0 18px #681d2b}.tabs{display:flex;gap:7px}.tabs button{flex:1;padding:9px;background:#0e0b10;border:1px solid #49343c;color:#ccc}.tabs button.sel{border-color:#c54255}.loadbar{height:12px;border:1px solid #79515b;margin:24px 0;background:#0a080b}.loadfill{height:100%;width:0;background:#9d2e40;transition:width 1.4s}
</style></head><body>
<div id="app"><div id="stage"><canvas id="c"></canvas>
<div id="hud"><div class="portrait"><div class="crest">♞</div><div class="stats"><div class="name" id="build">Human Knight · Lv 1</div><div class="bar"><div class="hp" id="hp"></div></div><div class="bar"><div class="mp"></div></div><div class="bar"><div class="xp" id="xp"></div></div></div></div><div class="coins">◉ <span id="gold">0</span>　◆ 0</div></div>
<div id="quest"><div class="qtitle">The Broken Castle</div><span class="diamond">◇</span> Find the first sigil.</div></div>
<div id="controls"><div class="move">
<div><button class="btn big" data-k="left">←</button><div class="caption">LEFT</div></div>
<div><button class="btn big" data-k="right">→</button><div class="caption">RIGHT</div></div>
<div><button class="btn big" data-k="jump">↑</button><div class="caption">JUMP</div></div></div>
<div class="combat"><div class="abilities">
<div><button class="btn ability" data-k="a1">🔥</button><div class="caption">I</div></div>
<div><button class="btn ability" data-k="a2">✦</button><div class="caption">II</div></div>
<div><button class="btn ability" data-k="a3">☄</button><div class="caption">III</div></div></div>
<div class="actions"><div><button class="btn act" data-k="block">⬟</button><div class="caption">BLOCK</div></div><div><button class="btn act" data-k="dodge">➶</button><div class="caption">DODGE</div></div><div><button class="btn act" data-k="attack">⚔</button><div class="caption">ATTACK</div></div></div></div></div></div>

<div id="splash"><div class="panel"><div class="sigil">†</div><div class="logo">FRACTURED</div><div class="subtitle">THE DARKNESS</div><p style="opacity:.65;margin:34px 0">Worlds fracture. Blood remembers.</p><button class="gbtn" onclick="showSelect()">TAP TO BEGIN</button></div></div>
<div id="select"><div class="panel"><div class="logo" style="font-size:25px">SELECT YOUR SOUL</div><p style="opacity:.6">Different paths. Same darkness.</p><div class="tabs"><button id="rt" class="sel">BLOODLINE</button><button id="ct">CLASS</button></div><div id="cards" class="selectgrid"></div><button class="gbtn" id="next">CHOOSE CLASS</button></div></div>
<div id="loading"><div class="panel"><div class="sigil">♱</div><div style="letter-spacing:4px">SOME SOULS WERE NEVER MEANT FOR LIGHT</div><div class="loadbar"><div class="loadfill" id="lf"></div></div><div style="opacity:.55">LOADING THE RUINS OF AELDREN...</div></div></div>
<script>
const races=["Human","Orc","Elf","Dragonborn","Demon","Angel","Fallen Angel","Tiefling","Vampire","Werewolf"],classes=["Knight","Mage","Witch","Samurai","Ronin","Ninja"];
let race="Human",cls="Knight",phase="race",keys={},P,enemies=[],last=0,started=false,gold=0,xp=0;
function showSelect(){splash.style.display="none";select.style.display="flex";renderCards()}
function renderCards(){cards.innerHTML="";let arr=phase==="race"?races:classes;arr.forEach((x,i)=>{let b=document.createElement("button");b.className="card "+(((phase==="race"?race:cls)===x)?"sel":"");b.innerHTML="<b>"+x+"</b><br><small>"+(phase==="race"?"Bloodline traits":"Combat discipline")+"</small>";b.onclick=()=>{if(phase==="race")race=x;else cls=x;renderCards()};cards.appendChild(b)})}
next.onclick=()=>{if(phase==="race"){phase="class";rt.classList.remove("sel");ct.classList.add("sel");next.textContent="ENTER THE DARKNESS";renderCards()}else{select.style.display="none";loading.style.display="flex";setTimeout(()=>lf.style.width="100%",50);setTimeout(begin,1500)}};
const c=document.getElementById("c"),ctx=c.getContext("2d");let W,H,D=1;
function resize(){let r=c.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener("resize",resize);resize();
document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};["onpointerup","onpointercancel","onpointerleave"].forEach(n=>b[n]=()=>keys[k]=false)});
function begin(){loading.style.display="none";resize();started=true;build.textContent=race+" "+cls+" · Lv 1";P={x:90,y:gy(),vx:0,vy:0,on:true,face:1,hp:100,atk:0,dodge:0,block:false};enemies=[{x:360,hp:70},{x:650,hp:90},{x:920,hp:120}];requestAnimationFrame(loop)}
function gy(){return H*.80}
function update(dt){let l=keys.left?1:0,r=keys.right?1:0;P.vx=(r-l)*155;if(l)P.face=-1;if(r)P.face=1;if(keys.jump&&P.on){P.vy=-330;P.on=false;keys.jump=false}if(keys.dodge&&P.dodge<=0){P.dodge=.25;P.vx=P.face*360;keys.dodge=false}P.block=!!keys.block;if(keys.attack&&P.atk<=0){P.atk=.28;keys.attack=false;enemies.forEach(e=>{if(e.hp>0&&Math.abs(e.x-P.x)<80){e.hp-=25;if(e.hp<=0){gold+=15;xp+=35}}})}if(keys.a1||keys.a2||keys.a3){enemies.forEach(e=>{if(e.hp>0&&Math.abs(e.x-P.x)<125)e.hp-=10});keys.a1=keys.a2=keys.a3=false}P.atk=Math.max(0,P.atk-dt);P.dodge=Math.max(0,P.dodge-dt);P.vy+=760*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;if(!Number.isFinite(P.x))P.x=90;if(!Number.isFinite(P.y))P.y=gy();if(P.y>=gy()){P.y=gy();P.vy=0;P.on=true}P.x=Math.max(35,Math.min(1100,P.x));goldEl=document.getElementById("gold");goldEl.textContent=gold;document.getElementById("xp").style.width=Math.min(100,xp)+"%"}
function bg(){let y=gy();let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#0b1320");grad.addColorStop(.55,"#151522");grad.addColorStop(1,"#08070a");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle="#d5d2cf";ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(W*.75,H*.22,45,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle="#17151c";for(let i=0;i<8;i++){let x=i*85-20,h=90+(i%3)*45;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-h);ctx.lineTo(x+18,y-h-35);ctx.lineTo(x+36,y-h);ctx.lineTo(x+52,y);ctx.fill()}ctx.fillStyle="#08080b";ctx.fillRect(0,y,W,H-y);ctx.strokeStyle="#433b42";for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+12,H);ctx.stroke()}}
function hero(){let x=Math.max(55,Math.min(W*.42,P.x)),y=Math.min(gy(),Math.max(85,P.y));ctx.save();ctx.translate(x,y);ctx.scale(1.28,1.28);if(P.face<0)ctx.scale(-1,1);ctx.fillStyle="#0009";ctx.beginPath();ctx.ellipse(0,2,23,5,0,0,7);ctx.fill();ctx.fillStyle="#721c2b";ctx.beginPath();ctx.moveTo(-10,-48);ctx.lineTo(-35,-4);ctx.lineTo(5,-10);ctx.fill();ctx.fillStyle="#595b63";ctx.beginPath();ctx.moveTo(-14,-50);ctx.lineTo(0,-61);ctx.lineTo(15,-50);ctx.lineTo(12,-15);ctx.lineTo(-12,-15);ctx.fill();ctx.fillStyle="#202126";ctx.fillRect(-10,-16,7,17);ctx.fillRect(4,-16,7,17);ctx.fillStyle="#999aa0";ctx.beginPath();ctx.arc(0,-63,10,0,7);ctx.fill();ctx.fillStyle="#18171b";ctx.fillRect(-9,-69,18,7);ctx.strokeStyle="#ddd";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(12,-35);ctx.lineTo(P.atk?55:38,-51);ctx.stroke();if(P.block){ctx.fillStyle="#4b4d55";ctx.beginPath();ctx.arc(-17,-36,13,0,7);ctx.fill()}ctx.restore()}
function foe(e){if(e.hp<=0)return;let x=e.x-P.x+W*.45;if(x<0||x>W)return;let y=gy();ctx.save();ctx.translate(x,y);ctx.fillStyle="#5b443b";ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(-11,-39);ctx.lineTo(0,-50);ctx.lineTo(12,-38);ctx.lineTo(13,0);ctx.fill();ctx.fillStyle="#ddd";ctx.beginPath();ctx.arc(0,-50,7,0,7);ctx.fill();ctx.fillStyle="#a72e42";ctx.fillRect(-18,-65,36*Math.max(0,e.hp/70),4);ctx.restore()}
function draw(){bg();enemies.forEach(foe);hero()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;if(started){update(dt);draw()}requestAnimationFrame(loop)}
</script></body></html>
